# Blueprint de Render: crea el servicio del servidor de Minu desde este repositorio.
# En Render: New > Blueprint > elige el repo. Te pedirá las variables marcadas con sync: false.
services:
  - type: web
    name: minu-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI # cadena de conexión de MongoDB Atlas (mongodb+srv://...)
        sync: false
      - key: ALLOWED_EMAILS # correos de Google que pueden crear cuenta, separados por coma
        sync: false
      - key: GOOGLE_CLIENT_IDS # "ID de cliente web" de Google (Firebase > Authentication > Google)
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT # contenido completo del JSON de la cuenta de servicio de Firebase
        sync: false
      - key: MIND_API_KEY # llave de Groq (console.groq.com → API Keys) para el mensaje del día de Minu; sin ella usa su banco de frases
        sync: false
      # Opcionales para cambiar de proveedor (cualquier API compatible con OpenAI):
      # MIND_BASE_URL (por defecto https://api.groq.com/openai/v1) y MIND_MODEL (por defecto openai/gpt-oss-120b)
      - key: JWT_SECRET # se genera solo
        generateValue: true
